<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix-like Video Streamer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #111;
      color: white;
    }

    .header {
      background: #000;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 2rem;
    }

    .video-player {
      text-align: center;
      margin-top: 20px;
    }

    video {
      width: 80%;
      max-width: 800px;
      border: 4px solid #444;
      border-radius: 10px;
    }

    .category {
      margin-top: 40px;
    }

    .category h2 {
      font-size: 1.5rem;
      text-align: center;
    }

    .video-row {
      display: flex;
      justify-content: center;
      overflow-x: auto;
      padding: 10px;
    }

    .video-item {
      margin: 10px;
      cursor: pointer;
      border-radius: 8px;
      overflow: hidden;
      width: 200px;
      height: 300px;
      transition: transform 0.3s ease;
    }

    .video-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-item:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>Netflix-like Video Streamer</h1>
  </div>

  <!-- Video Player -->
  <div class="video-player">
    <video id="videoPlayer" controls autoplay>
      <source id="videoSource" src="" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>
  </div>

  <!-- Categories -->
  <div class="category">
    <h2>Action Movies</h2>
    <div class="video-row">
      <!-- Action Movie Thumbnails -->
      <div class="video-item" onclick="loadVideo('1XyZg123ABCxyz456')">
        <img src="action1.jpg" alt="Action 1">
      </div>
      <div class="video-item" onclick="loadVideo('2XyZg123ABCxyz456')">
        <img src="action2.jpg" alt="Action 2">
      </div>
      <!-- Add more action movie thumbnails -->
    </div>
  </div>

  <div class="category">
    <h2>Comedy Movies</h2>
    <div class="video-row">
      <!-- Comedy Movie Thumbnails -->
      <div class="video-item" onclick="loadVideo('3XyZg123ABCxyz456')">
        <img src="comedy1.jpg" alt="Comedy 1">
      </div>
      <div class="video-item" onclick="loadVideo('4XyZg123ABCxyz456')">
        <img src="comedy2.jpg" alt="Comedy 2">
      </div>
      <!-- Add more comedy movie thumbnails -->
    </div>
  </div>

  <!-- Add more categories as needed -->

  <script>
    // Function to change video source
    function loadVideo(fileId) {
      const videoPlayer = document.getElementById('videoPlayer');
      const videoSource = document.getElementById('videoSource');
      videoSource.src = `https://drive.google.com/uc?export=download&id=${fileId}`;
      videoPlayer.load();
      videoPlayer.play();
    }
  </script>

</body>
</html>
