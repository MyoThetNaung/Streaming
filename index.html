<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streaming APP</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #111;
      color: white;
    }

    .header {
      background: #000;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 2rem;
    }

    .video-player {
      text-align: center;
      margin-top: 20px;
    }

    video {
      width: 80%;
      max-width: 800px;
      border: 4px solid #444;
      border-radius: 10px;
    }

    .dropdown-container {
      text-align: center;
      margin-top: 40px;
    }

    select {
      background-color: #333;
      color: white;
      padding: 10px;
      border-radius: 5px;
      font-size: 16px;
      border: none;
      width: 200px;
    }

    .video-row {
      display: flex;
      justify-content: center;
      overflow-x: auto;
      padding: 10px;
      margin-top: 20px;
    }

    .video-item {
      margin: 10px;
      cursor: pointer;
      border-radius: 8px;
      overflow: hidden;
      width: 200px;
      height: 300px;
      transition: transform 0.3s ease;
    }

    .video-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-item:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>Netflix-like Video Streamer</h1>
  </div>

  <!-- Video Player -->
  <div class="video-player">
    <video id="videoPlayer" controls autoplay>
      <source id="videoSource" src="" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>
  </div>

  <!-- Dropdown Category Selector -->
  <div class="dropdown-container">
    <select id="categorySelector" onchange="loadCategoryVideos()">
      <option value="" disabled selected>Select a category</option>
      <option value="action">Action Movies</option>
      <option value="comedy">Comedy Movies</option>
      <option value="drama">Drama Movies</option>
    </select>
  </div>

  <!-- Video Thumbnails Container -->
  <div id="videoContainer" class="video-row">
    <!-- Video thumbnails will appear here -->
  </div>

  <script>
    const videoCategories = {
      action: [
        { id: '1XyZg123ABCxyz456', title: 'Action Movie 1', thumbnail: 'action1.jpg' },
        { id: '2XyZg123ABCxyz456', title: 'Action Movie 2', thumbnail: 'action2.jpg' }
      ],
      comedy: [
        { id: '3XyZg123ABCxyz456', title: 'Comedy Movie 1', thumbnail: 'comedy1.jpg' },
        { id: '4XyZg123ABCxyz456', title: 'Comedy Movie 2', thumbnail: 'comedy2.jpg' }
      ],
      drama: [
        { id: '5XyZg123ABCxyz456', title: 'Drama Movie 1', thumbnail: 'drama1.jpg' },
        { id: '6XyZg123ABCxyz456', title: 'Drama Movie 2', thumbnail: 'drama2.jpg' }
      ]
    };

    // Function to load videos based on selected category
    function loadCategoryVideos() {
      const category = document.getElementById('categorySelector').value;
      const videoContainer = document.getElementById('videoContainer');
      videoContainer.innerHTML = '';  // Clear previous videos

      if (category && videoCategories[category]) {
        videoCategories[category].forEach(video => {
          const videoItem = document.createElement('div');
          videoItem.classList.add('video-item');
          videoItem.onclick = function() {
            loadVideo(video.id);
          };
          videoItem.innerHTML = `<img src="${video.thumbnail}" alt="${video.title}">`;
          videoContainer.appendChild(videoItem);
        });
      }
    }

    // Function to load and play selected video
    function loadVideo(fileId) {
      const videoPlayer = document.getElementById('videoPlayer');
      const videoSource = document.getElementById('videoSource');
      videoSource.src = `https://drive.google.com/uc?export=download&id=${fileId}`;
      videoPlayer.load();
      videoPlayer.play();
    }
  </script>

</body>
</html>
